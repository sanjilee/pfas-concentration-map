name: Validate application and database access
on:
  pull_request:
  push:
    branches: [codex/admin-data-management]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pfas_test
    steps:
      - uses: actions/checkout@v4
      - name: Initialize isolated auth test fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_fixture.sql
      - name: Apply schema migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify authorization, validation and atomicity
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/admin_management.sql
